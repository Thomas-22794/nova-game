<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),R=Math.random,PI2=6.2832;
const PAL=[{n:'NÉON',c:['#ff2bd6','#00f0ff','#fff200','#7dff3a'],b:['#1d0540','#050a2e'],h:300,s:70},
{n:'LAVE',c:['#ff3b1f','#ff9d00','#ffee00','#ff2e88'],b:['#33061a','#12020a'],h:25,s:35},
{n:'OCÉAN',c:['#00ffd5','#2b8cff','#b46bff','#5dff7a'],b:['#032640','#0b0540'],h:190,s:50}];
const MODES=[['CLASSIQUE','3 vies, évite les mines','♥'],['CHRONO','60 s, chaque mine coûte 3 s','◷'],['ZEN','Aucune mine, juste le flow','∞']];
let W,H,D;function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();
let st='menu',mode=0,pi=0,t=0,score=0,disp=0,lives=3,tl=60,chain=0,chT=0,level=1,catches=0,pcd=0,magT=0,zm=0,shake=0,flash=0,dyT=0,overT=0,beatT=0,step=0,hov=-1,muted=false,inv=0,spawnT=0,mineT=0,newBest=false;
let mx=W/2,my=H/2,x=W/2,y=H/2,hist=[],orbs=[],mines=[],parts=[],rings=[],fts=[];
let bests={classic:0,time:0,zen:0};try{Object.assign(bests,JSON.parse(localStorage.getItem('novarush')||'{}'))}catch(e){}
const bk=()=>['classic','time','zen'][mode];

const gs={};function glow(c){if(gs[c])return gs[c];const k=document.createElement('canvas');k.width=k.height=64;const q=k.getContext('2d'),r=q.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,c);r.addColorStop(.25,c+'aa');r.addColorStop(1,c+'00');q.fillStyle=r;q.fillRect(0,0,64,64);return gs[c]=k}

/* AUDIO */
let ac,mg,nb;
function A(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.7;mg.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}return ac}
function tn(f,d,ty='sine',v=.1,f2,dl=0){try{const a=A(),o=a.createOscillator(),e=a.createGain(),s=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);e.gain.setValueAtTime(v,s);e.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(e);e.connect(mg);o.start(s);o.stop(s+d+.02)}catch(e){}}
function ns(d,v,f0,f1,dl=0){try{const a=A(),o=a.createBufferSource(),e=a.createGain(),f=a.createBiquadFilter(),s=a.currentTime+dl;o.buffer=nb;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f0,s);f.frequency.exponentialRampToValueAtTime(f1,s+d);e.gain.setValueAtTime(v,s);e.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(f);f.connect(e);e.connect(mg);o.start(s);o.stop(s+d+.02)}catch(e){}}
const SC=[0,2,4,7,9,12,14,16,19,21];

pulse(){ns(.5,.25,300,4000);tn(180,.4,'sawtooth',.06,900)},boom(){ns(.6,.4,1200,60);tn(140,.5,'sine',.3,35)},
mine(){ns(.35,.3,3000,200);tn(300,.3,'square',.06,60)},lvl(){[0,4,7,12].forEach((n,i)=>tn(523*2**(n/12),.2,'square',.05,0,i*.07))},

/* GAME */
const cs=()=>PAL[pi].c;
function burst(px,py,c,n,sp=280){for(let i=0;i<n;i++){const a=R()*PI2,v=sp*(.2+R());parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:c=='rnd'?cs()[R()*4|0]:c,r:1.5+R()*3})}}

/* LAYOUT */

 const P=PAL[pi],C=P.c,bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,P.b[0]);bg.addColorStop(1,P.b[1]);g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.save();g.translate(W/2,H/2);const z=1+zm*.025;g.scale(z,z);g.translate(-W/2+(shake>.5?(R()-.5)*shake:0),-H/2+(shake>.5?(R()-.5)*shake:0));

 for(const s of stars){g.globalAlpha=.2+s.z*.7;g.fillStyle='#fff';g.fillRect(s.x*W+(mx-W/2)*s.z*-.03,s.y*H,1+s.z*1.5,1+s.z*2.5)}
 for(const r of rings){g.globalAlpha=Math.max(0,r.l);g.strokeStyle=r.c;g.lineWidth=2+6*r.l;g.beginPath();g.arc(r.x,r.y,r.r,0,PI2);g.stroke()}
 for(const o of orbs){const sc=Math.min(1,o.age*3)*(o.life<2?.5+.5*Math.sin(t*22):1),r=(o.big?16:10)*sc*(1+.1*Math.sin(t*5+o.x));

 if(st!='over'){for(let i=1;i<hist.length;i++){const k=i/hist.length,a=hist[i-1],b=hist[i],h=P.h+Math.sin(t*2+i*.12)*P.s;g.strokeStyle='hsl('+h+',100%,'+(55+k*15)+'%)';g.lineWidth=k*24;g.globalAlpha=.3;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.lineWidth=k*8;g.globalAlpha=1;g.strokeStyle='hsl('+h+',100%,82%)';g.stroke()}
  if(!(inv>0&&Math.sin(inv*40)>0)){const hc=C[Math.floor(t*2)%4];gl(hc,x,y,110+(pcd<=0?Math.sin(t*8)*10:0),.9);gl('#fff',x,y,44,1);

   else if(st=='play'){g.globalAlpha=.5+.3*Math.sin(t*8);g.strokeStyle=hc;g.lineWidth=2;g.beginPath();g.arc(x,y,28+Math.sin(t*8)*3,0,PI2);g.stroke()}}}
 for(const p of parts)gl(p.c,p.x,p.y,p.r*9*p.l+2,Math.min(1,p.l*1.4));

function drawOver(C){const timeUp=mode==1&&tl<=0;
